# Create this manually before applying k8sgpt-groq.yaml:
# kubectl create secret generic groq-api-key #   --from-literal=groq-api-key=YOUR_GROQ_API_KEY #   -n k8sgpt-operator-system
apiVersion: v1
kind: Secret
metadata:
  name: groq-api-key
  namespace: k8sgpt-operator-system
type: Opaque
# data is created via kubectl create secret (not stored in git)
