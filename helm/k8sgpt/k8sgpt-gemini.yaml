# k8sgpt-gemini.yaml
apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: k8sgpt-gemini
  namespace: k8sgpt-operator-system
spec:
  ai:
    enabled: true
    backend: google
    model: gemini-1.5-flash  # or gemini-pro for higher quality
    secret:
      name: gemini-api-key
      key: gemini-api-key
  noCache: false
  repository: ghcr.io/k8sgpt-ai/k8sgpt
  version: v0.3.48