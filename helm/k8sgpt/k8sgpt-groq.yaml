# k8sgpt-groq.yaml
apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: k8sgpt-groq
  namespace: k8sgpt-operator-system
spec:
  ai:
    enabled: true
    backend: localai
    model: llama-3.1-8b-instant  # Fastest option, or use llama-3.3-70b-versatile for better quality
    baseUrl: https://api.groq.com/openai/v1
    secret:
      name: groq-api-key
      key: groq-api-key
  noCache: false
  repository: ghcr.io/k8sgpt-ai/k8sgpt
  version: v0.3.48