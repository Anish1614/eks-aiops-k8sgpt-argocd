apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-nginx-deploy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-nginx
  template:
    metadata:
      labels:
        app: broken-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latestt  # Typo in image name to trigger ImagePullBackOff
        ports:
        - containerPort: 80
