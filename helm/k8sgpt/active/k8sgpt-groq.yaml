apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: k8sgpt-groq
  namespace: k8sgpt-operator-system
spec:
  ai:
    enabled: true
    model: llama-3.1-70b-versatile
    backend: localai
    baseUrl: http://k8sgpt-groq:8080/v1
    secret:
      name: k8sgpt-groq-secret
      key: api-key
  remoteCache:
    interplex:
      endpoint: http://k8sgpt-interplex-service.k8sgpt-operator-system.svc.cluster.local:8084
  repository: k8sgpt-ai/k8sgpt
  version: v0.3.48
  autoRemediation:
    enabled: true
    riskThreshold: 10
    resources:
      - Pod
      - Deployment
    git:
      enabled: true
      repository: https://github.com/Anish1614/eks-aiops-k8sgpt-argocd
      tokenSecretRef: git-token-secret
      # Optional: specify branch (defaults to main/master)
      branch: main
      # Optional: commit message template
      commitMessage: "fix(k8sgpt): auto-remediate {kind}/{name} - {error}"