apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: k8sgpt-bedrock
  namespace: k8sgpt-operator-system
spec:
  version: v0.4.1  # Fixed: v0.4.30 doesn't exist
  ai:
    enabled: true
    model: amazon.nova-lite-v1:0  # Fixed: Claude 3.5 Haiku is deprecated
    backend: amazonbedrock
    region: us-east-1
  noCache: false
  filters:
    - Pod
    - Deployment
    - Service
    - ReplicaSet
  deployment:
    serviceAccountName: k8sgpt-bedrock  # Critical: Uses IRSA SA